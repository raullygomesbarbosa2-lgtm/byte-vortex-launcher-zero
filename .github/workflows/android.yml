name: Byte Vortex Launcher — novo visual dourado
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Publish new APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: from-scratch-gold-v3
          name: Byte Vortex Emuladores — dourado v3
          make_latest: true
          body: 'Versão 3. Corrige gesto de puxar para cima em qualquer ponto da tela; mantém a imagem enviada como papel de parede. Android 6.0+.'
          files: app/build/outputs/apk/debug/app-debug.apk
